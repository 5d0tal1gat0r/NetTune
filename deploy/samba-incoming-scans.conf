# Samba share for the incoming scan tree.
#
# Install to /etc/samba/smb.conf.d/ (or append to /etc/samba/smb.conf), then:
#   sudo testparm -s && sudo systemctl restart smbd
#
# The colleague's PC keeps its existing mapped drive: this only fixes the
# share definition on the Pi so the path actually resolves.

[incoming_scans]
   comment = Escaneos de logs de seguridad
   path = /srv/security_scans/incoming_scans
   browseable = yes
   writable = yes
   guest ok = yes
   public = yes
   force user = scanproc
   force group = scanproc
   create mask = 0664
   directory mask = 0775
   # Windows Explorer writes these constantly; keep them out of the tree.
   veto files = /Thumbs.db/desktop.ini/.DS_Store/
   delete veto files = yes

   # SECURITY: this share is guest-writable, so anyone who can reach port 445
   # on this Pi can read, write and DELETE the whole scan tree, archive
   # included. That matches how the colleague's existing mapped drive connects,
   # so it is the default -- but restrict it if you can.
   #
   # Re-run install.sh with SAMBA_HOSTS_ALLOW to lock it to your tailnet:
   #   sudo SAMBA_HOSTS_ALLOW="100.64.0.0/10 127.0.0.1" ./deploy/install.sh
   # Only do this once you know the colleague's PC connects over Tailscale and
   # not over the LAN, or their mapped drive will stop working.
   # hosts allow = 100.64.0.0/10 127.0.0.1
