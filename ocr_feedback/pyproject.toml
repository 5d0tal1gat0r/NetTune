[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ocr-feedback"
version = "0.1.0"
description = "Turn human corrections of OCR output into a dataset and an eval harness."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ocr-feedback = "ocr_feedback.cli:main"

[tool.setuptools]
package-dir = {"ocr_feedback" = "."}
packages = ["ocr_feedback"]
